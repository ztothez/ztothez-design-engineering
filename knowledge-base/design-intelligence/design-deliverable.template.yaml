productTask:
  productContractId: example-product-contract
  contractPath: evidence/product/product-contract.yaml
  primaryUser: Operations professional responsible for reviewing and resolving evidence-backed findings
  task: Identify the highest-priority issue, inspect its evidence and impact, route remediation, and verify the outcome.
  successCriteria:
    - The user can identify scope, priority, evidence, impact, next action, and validation method.
    - Consequential actions preserve state, provenance, and recovery information.
  consequentialActions:
    - Route an approved finding to the remediation queue.
    - Export or retain an operational result.
interfaceTrust:
  contractId: operational-interface-trust-v1
  contractPath: knowledge-base/design-intelligence/interface-trust.template.yaml
  version: "1.0"
  status: declared
  requiredScenarios: [demo, live, fallback, stale, disconnected]
informationHierarchy:
  contractId: operational-information-design-v1
  contractPath: knowledge-base/design-intelligence/information-design.template.yaml
  version: "1.0"
  status: declared
  levels:
    - context-provenance
    - primary-outcome-action
    - critical-exceptions
    - health-impact-metrics
    - prioritized-findings
    - operational-telemetry
    - evidence-audit-trail
    - history-exports
metricContracts:
  informationContractId: operational-information-design-v1
  metrics:
    - metricId: recoverable-monthly-cost
      decision: Decide how much current cost merits drill-down and validated remediation.
      hierarchyLevel: primary-outcome-action
      chartRefs: []
    - metricId: critical-finding-count
      decision: Decide which current exceptions require immediate review.
      hierarchyLevel: health-impact-metrics
      chartRefs: []
    - metricId: validation-pass-rate
      decision: Decide whether remediation failures need process correction or targeted follow-up.
      hierarchyLevel: operational-telemetry
      chartRefs: [validation-outcome-trend]
generationWorkflow:
  steps:
    - { stage: product-task, status: declared, artifactRefs: [example-product-contract] }
    - { stage: truth-data-source-contract, status: declared, artifactRefs: [operational-interface-trust-v1] }
    - { stage: information-architecture, status: declared, artifactRefs: [operational-information-design-v1] }
    - { stage: interaction-state-model, status: declared, artifactRefs: [example-product-design-system] }
    - { stage: visual-direction, status: declared, artifactRefs: [visual-direction-brief] }
    - { stage: token-architecture, status: declared, artifactRefs: [example-product-design-system] }
    - { stage: implementation, status: required, artifactRefs: [] }
    - { stage: automated-verification, status: required, artifactRefs: [] }
    - { stage: human-visual-review, status: review-required, artifactRefs: [] }
visualDirection:
  domain: Enterprise operations and evidence review
  intent: A calm, precise, work-focused interface that makes scope, exceptions, evidence, and next actions immediately scannable.
  principles: [task-first hierarchy, restrained surfaces, explicit evidence, stable geometry]
  avoid: [decorative agent diagrams, excessive glow, meaningless gradients, ornamental status elements]
  tokenRefs: [color.semantic.text-primary, color.semantic.text-secondary, color.semantic.surface, color.semantic.surface-subtle, color.semantic.action-primary, color.semantic.border-default]
  ornamentPolicy:
    decorativeAgentDiagrams: false
    excessiveGlow: false
    meaninglessGradients: false
    ornamentalStatusElements: false
  referenceEvidenceRefs: [visual-direction-brief]
typography:
  minimumBodySizePx: 16
  maximumLineLengthCharacters: 72
  numericAlignment: tabular
  roles:
    - { role: body, familyToken: font.semantic.interface, sizeToken: type.semantic.body, weightToken: weight.semantic.body, lineHeightToken: leading.semantic.reading, colorToken: color.semantic.text-primary, usage: "Instructions, descriptions, and sustained reading." }
    - { role: label, familyToken: font.semantic.interface, sizeToken: type.semantic.label, weightToken: weight.semantic.label, lineHeightToken: leading.semantic.normal, colorToken: color.semantic.text-primary, usage: "Controls, fields, table headers, and concise categories." }
    - { role: heading, familyToken: font.semantic.interface, sizeToken: type.semantic.heading, weightToken: weight.semantic.heading, lineHeightToken: leading.semantic.tight, colorToken: color.semantic.text-primary, usage: Page and section hierarchy without dashboard hero scaling. }
    - { role: metadata, familyToken: font.semantic.interface, sizeToken: type.semantic.metadata, weightToken: weight.semantic.body, lineHeightToken: leading.semantic.normal, colorToken: color.semantic.text-secondary, usage: "Scope, timestamps, provenance, and secondary identifiers." }
    - { role: metric, familyToken: font.semantic.interface, sizeToken: type.semantic.metric, weightToken: weight.semantic.metric, lineHeightToken: leading.semantic.tight, colorToken: color.semantic.text-primary, usage: Decision metrics with tabular numerals and explicit units. }
    - { role: evidence, familyToken: font.semantic.interface, sizeToken: type.semantic.evidence, weightToken: weight.semantic.body, lineHeightToken: leading.semantic.reading, colorToken: color.semantic.text-primary, usage: "Observations, limitations, and validation evidence." }
    - { role: log, familyToken: font.semantic.code, sizeToken: type.semantic.log, weightToken: weight.semantic.body, lineHeightToken: leading.semantic.normal, colorToken: color.semantic.text-secondary, usage: Runtime logs and ordered processing output. }
    - { role: code, familyToken: font.semantic.code, sizeToken: type.semantic.code, weightToken: weight.semantic.body, lineHeightToken: leading.semantic.normal, colorToken: color.semantic.text-primary, usage: "Commands, identifiers, paths, and code fragments." }
composition:
  contentWidth: { strategy: hybrid, maximumPx: 1200 }
  grids:
    - { viewport: 375, columns: 4, gutterToken: space.semantic.12, marginToken: space.semantic.16, composition: "Single-column task flow with primary outcome, exceptions, and action before telemetry." }
    - { viewport: 768, columns: 8, gutterToken: space.semantic.16, marginToken: space.semantic.24, composition: Two-region layout where evidence follows the primary task without side scrolling. }
    - { viewport: 1024, columns: 12, gutterToken: space.semantic.24, marginToken: space.semantic.24, composition: Operational overview with bounded metric row and prioritized findings. }
    - { viewport: 1440, columns: 12, gutterToken: space.semantic.24, marginToken: space.semantic.32, composition: "Bounded workspace with stable navigation, main evidence, and contextual detail regions." }
  spacingRhythm:
    baseToken: space.semantic.4
    allowedStepTokens: [space.semantic.4, space.semantic.8, space.semantic.12, space.semantic.16, space.semantic.24, space.semantic.32, space.semantic.64]
  alignmentRules:
    - Align labels, values, and actions to shared grid lines rather than card edges chosen per section.
    - Right-align comparable numeric columns and preserve tabular numeral alignment during loading.
    - Keep evidence and limitations directly below the outcome they qualify.
  stableDimensions:
    - { component: primary-toolbar, behavior: fixed, tokenRefs: [size.semantic.control], rationale: Loading labels and tool states must not resize the command surface. }
    - { component: findings-table-row, behavior: bounded, tokenRefs: [size.semantic.row, size.semantic.row-compact], rationale: Long labels wrap within bounded rows without shifting adjacent controls. }
  surfaces:
    - { role: canvas, tokenRef: color.semantic.surface }
    - { role: subtle, tokenRef: color.semantic.surface-subtle }
    - { role: raised, tokenRef: color.semantic.surface-raised }
    - { role: overlay, tokenRef: color.semantic.surface-overlay }
    - { role: inverse, tokenRef: color.semantic.surface-inverse }
  borders:
    - { role: default, tokenRef: color.semantic.border-default }
    - { role: strong, tokenRef: color.semantic.border-strong }
    - { role: focus, tokenRef: color.semantic.action-primary }
    - { role: selected, tokenRef: color.semantic.border-selected }
  elevations:
    - { role: base, tokenRef: shadow.semantic.base }
    - { role: raised, tokenRef: shadow.semantic.raised }
    - { role: overlay, tokenRef: shadow.semantic.overlay }
  emphasis:
    - { level: primary, textToken: color.semantic.text-primary, surfaceToken: color.semantic.surface }
    - { level: secondary, textToken: color.semantic.text-primary, surfaceToken: color.semantic.surface-subtle }
    - { level: tertiary, textToken: color.semantic.text-secondary, surfaceToken: color.semantic.surface }
    - { level: muted, textToken: color.semantic.text-secondary, surfaceToken: color.semantic.surface-subtle }
  selectedState:
    backgroundToken: color.semantic.surface-selected
    borderToken: color.semantic.border-selected
    indicator: Persistent leading selection indicator
    nonColorCue: Selected label and checked icon remain visible without color
densityProfile:
  mode: adaptive
  rationale: Repeated operational scanning benefits from compact rows while consequential actions and evidence retain comfortable spacing.
  controlHeightToken: size.semantic.control
  rowHeightToken: size.semantic.row
  compactRowHeightToken: size.semantic.row-compact
  spacingTokenRefs: [space.semantic.4, space.semantic.8, space.semantic.12, space.semantic.16, space.semantic.24]
  maximumPrimaryActions: 2
  viewportBehavior:
    - { viewport: 375, mode: comfortable, visiblePriorities: [context, primary outcome, critical exception, next action] }
    - { viewport: 768, mode: comfortable, visiblePriorities: [context, primary outcome, critical exceptions, impact, next action] }
    - { viewport: 1024, mode: compact, visiblePriorities: [context, outcome, exceptions, metrics, findings, action] }
    - { viewport: 1440, mode: compact, visiblePriorities: [context, outcome, exceptions, metrics, findings, telemetry, evidence] }
interactionStates:
  states:
    - { state: loading, behavior: Preserve component geometry and announce bounded progress., tokenRefs: [color.semantic.text-secondary, color.semantic.surface-subtle], textCue: true, iconCue: false }
    - { state: empty, behavior: "Preserve scope, explain why no records appear, and expose recovery.", tokenRefs: [color.semantic.text-secondary, color.semantic.surface-subtle], textCue: true, iconCue: true }
    - { state: success, behavior: Name the completed outcome and retain validation evidence., tokenRefs: [color.semantic.status-success, color.semantic.surface], textCue: true, iconCue: true }
    - { state: warning, behavior: State the risk and available action without blocking unrelated work., tokenRefs: [color.semantic.status-warning, color.semantic.surface], textCue: true, iconCue: true }
    - { state: error, behavior: "Preserve entered context, state the failure, and expose retry or recovery.", tokenRefs: [color.semantic.status-error, color.semantic.surface], textCue: true, iconCue: true }
    - { state: partial, behavior: "Show available content, excluded scope, limitation, and retry action.", tokenRefs: [color.semantic.status-warning, color.semantic.surface-subtle], textCue: true, iconCue: true }
    - { state: disabled, behavior: Keep the control legible and explain prerequisites when the reason is not obvious., tokenRefs: [color.semantic.text-secondary, color.semantic.surface-subtle], textCue: true, iconCue: false }
    - { state: selected, behavior: "Preserve a border, indicator, label, and checked icon independent of color.", tokenRefs: [color.semantic.surface-selected, color.semantic.border-selected], textCue: true, iconCue: true }
    - { state: focus, behavior: Draw a persistent high-contrast focus border outside component content., tokenRefs: [color.semantic.action-primary, color.semantic.surface], textCue: false, iconCue: false }
motion:
  durationTokens:
    instant: duration.semantic.instant
    feedback: duration.semantic.feedback
    transition: duration.semantic.transition
    emphasis: duration.semantic.emphasis
  motions:
    - { id: selection-feedback, purpose: Confirm a changed selection without moving surrounding content., trigger: User selects a finding row, property: color, durationCategory: feedback, interruptible: true }
    - { id: detail-transition, purpose: Preserve spatial continuity when contextual details open., trigger: User opens finding details, property: opacity, durationCategory: transition, interruptible: true }
  reducedMotion:
    strategy: replace
    equivalents:
      - { motionRef: selection-feedback, behavior: Apply the final selected tokens immediately while retaining border and icon cues. }
      - { motionRef: detail-transition, behavior: Show the detail region immediately and move focus to its heading without animation. }
chartContracts:
  - id: validation-outcome-trend
    purpose: Show whether remediation validation performance is improving and expose failed periods for investigation.
    type: line
    metricRefs: [validation-pass-rate]
    labelStrategy: direct
    titleVisible: true
    valuesVisible: true
    legend: { visible: false, reason: A single directly labeled series makes a separate legend redundant. }
    comparison: { status: available, context: Current seven-day period compared with the previous seven complete days. }
    alternative: { kind: table, path: /metrics/validation-pass-rate?view=table }
    states:
      loading: Preserve chart dimensions and show bounded loading text.
      empty: State that no completed validation runs exist in the selected period.
      partial: Show available periods and label excluded or delayed records.
      error: Preserve metric context and expose retry plus the table alternative.
    tokenRefs: [color.semantic.action-primary, color.semantic.text-primary, color.semantic.border-default]
    nonColorCues: [color, text, value, line-style]
    decorative: false
renderedEvidence:
  fixture:
    id: operational-overview
    sourcePath: ci/fixtures/responsive-overview.html
    route: /responsive-overview
  captures:
    - { viewport: 375, status: planned }
    - { viewport: 768, status: planned }
    - { viewport: 1024, status: planned }
    - { viewport: 1440, status: planned }
humanVisualReview:
  status: required
  dimensions: [hierarchy, balance, scanability, density, domain-fit]
  reviewers: []
brand:
  promise: Make consequential operational work understandable and verifiable
  audiences:
    - Operations professionals
    - Product reviewers
  attributes: [precise, calm, accountable]
  avoid: [decorative ambiguity, fake metrics, trend-only styling]
  voicePrinciples:
    - Name actions by their outcome
    - State evidence and limitations directly
  marks:
    - id: primary-wordmark
      role: primary
      asset: brand-wordmark
      clearSpace: Keep one symbol-width clear on every side
      minimumSize: 96 CSS pixels wide on screen
      allowedBackgrounds: [light-neutral, dark-neutral]
figma:
  pages:
    - name: Foundations
      role: foundations
      purpose: Tokens, type roles, grids, motion, and accessibility examples
    - name: Components
      role: components
      purpose: Published components, properties, states, and usage notes
    - name: Patterns
      role: patterns
      purpose: Task-centered compositions using published components
  collections:
    - name: Semantic color
      modes: [light, dark]
      tokens:
        - color.semantic.text-primary
        - color.semantic.surface
        - color.semantic.action-primary
        - color.component.button-primary-label
  components:
    - name: Button
      purpose: Trigger one named product action
      interactive: true
      properties:
        - name: Label
          type: text
        - name: State
          type: variant
        - name: Leading icon
          type: instance-swap
      states: [default, hover, focus, active, disabled, loading]
      documented: true
