$schema: https://json-schema.org/draft/2020-12/schema
$id: https://local.ztothez-design-engineering/schemas/interface-trust-1.0.schema.json
title: ZtotheZ Interface Trust Contract
description: Version 1.0 contract for interface state truth, operational claims, source traceability, and provenance-preserving records.
type: object
additionalProperties: false
required: [version, id, product, preparedAt, preparedBy, sources, states, claims, actions, records, security]
properties:
  version:
    const: "1.0"
  id:
    $ref: "#/$defs/id"
  product:
    $ref: "#/$defs/shortText"
  preparedAt:
    type: string
    format: date-time
  preparedBy:
    type: object
    additionalProperties: false
    required: [type, name]
    properties:
      type:
        enum: [agent, human, mixed]
      name:
        $ref: "#/$defs/shortText"
  sources:
    type: array
    minItems: 1
    maxItems: 500
    items:
      $ref: "#/$defs/source"
  states:
    type: array
    minItems: 5
    maxItems: 500
    items:
      $ref: "#/$defs/state"
  claims:
    type: array
    minItems: 1
    maxItems: 5000
    items:
      $ref: "#/$defs/claim"
  actions:
    type: array
    maxItems: 500
    items:
      $ref: "#/$defs/action"
  records:
    type: object
    additionalProperties: false
    required: [history, export]
    properties:
      history:
        $ref: "#/$defs/record"
      export:
        $ref: "#/$defs/record"
  security:
    type: object
    additionalProperties: false
    required: [allowsEmbeddedCredentials, credentialSources]
    properties:
      allowsEmbeddedCredentials:
        const: false
      credentialSources:
        type: array
        minItems: 1
        maxItems: 5
        uniqueItems: true
        items:
          enum: [environment, secret-manager, oauth, user-runtime, none]
$defs:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
  shortText:
    type: string
    minLength: 1
    maxLength: 256
  text:
    type: string
    minLength: 1
    maxLength: 1024
  idList:
    type: array
    maxItems: 500
    items:
      $ref: "#/$defs/id"
  source:
    type: object
    additionalProperties: false
    required: [id, kind, authority, description]
    properties:
      id:
        $ref: "#/$defs/id"
      kind:
        enum: [runtime-probe, authenticated-api, runtime-processing, user-input, import-record, cache-record, demo-fixture, local-simulation, configuration]
      authority:
        enum: [runtime, user, fixture, cache, configuration]
      description:
        type: string
        minLength: 1
        maxLength: 512
      evidence:
        type: string
        minLength: 1
        maxLength: 1024
      checkedAt:
        type: string
        format: date-time
  freshness:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        enum: [current, stale, unknown, not-applicable]
      observedAt:
        type: string
        format: date-time
      timezone:
        type: string
        minLength: 1
        maxLength: 128
    allOf:
      - if:
          properties:
            status:
              enum: [current, stale]
        then:
          required: [observedAt, timezone]
  state:
    type: object
    additionalProperties: false
    required: [id, scenario, dataMode, connection, result, freshness, environment, scope, limitations, sourceRefs]
    properties:
      id:
        $ref: "#/$defs/id"
      scenario:
        enum: [demo, live, fallback, stale, disconnected]
      dataMode:
        enum: [demo, live, hybrid, imported, cached]
      connection:
        enum: [unknown, checking, connected, degraded, disconnected]
      result:
        type: object
        additionalProperties: false
        required: [availability]
        properties:
          availability:
            enum: [none, pending, available, partial, failed]
          origin:
            enum: [live, simulated, imported, cached]
        allOf:
          - if:
              properties:
                availability:
                  enum: [available, partial]
            then:
              required: [origin]
            else:
              not:
                required: [origin]
      freshness:
        $ref: "#/$defs/freshness"
      environment:
        $ref: "#/$defs/shortText"
      scope:
        type: string
        minLength: 1
        maxLength: 512
      limitations:
        type: array
        maxItems: 30
        items:
          type: string
          minLength: 1
          maxLength: 512
      sourceRefs:
        type: array
        minItems: 1
        maxItems: 50
        items:
          $ref: "#/$defs/id"
      recoveryAction:
        type: string
        minLength: 1
        maxLength: 512
  claim:
    type: object
    additionalProperties: false
    required: [id, state, kind, text, classification, sourceRefs, locations, visibility]
    properties:
      id:
        $ref: "#/$defs/id"
      state:
        $ref: "#/$defs/id"
      kind:
        enum: [data-mode, connection-status, result-origin, freshness, environment, scope, processing-boundary, limitation, interface-availability, backend-availability]
      text:
        $ref: "#/$defs/text"
      classification:
        enum: [verified, demonstration, unknown]
      sourceRefs:
        type: array
        maxItems: 50
        items:
          $ref: "#/$defs/id"
      locations:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          enum: [shell, before-action, loading, result, error, history, export]
      visibility:
        enum: [persistent, contextual]
  action:
    type: object
    additionalProperties: false
    required: [id, label, outcome, consequential, stateRefs, disclosureClaimRefs]
    properties:
      id:
        $ref: "#/$defs/id"
      label:
        type: string
        minLength: 1
        maxLength: 160
      outcome:
        type: string
        minLength: 1
        maxLength: 512
      consequential:
        type: boolean
      stateRefs:
        type: array
        minItems: 1
        maxItems: 50
        items:
          $ref: "#/$defs/id"
      disclosureClaimRefs:
        type: array
        maxItems: 200
        items:
          $ref: "#/$defs/id"
  record:
    type: object
    additionalProperties: false
    required: [enabled, fields, stateRefs, disclosureClaimRefs]
    properties:
      enabled:
        type: boolean
      fields:
        type: array
        maxItems: 7
        uniqueItems: true
        items:
          enum: [data-mode, connection, result-origin, freshness, environment, scope, limitations]
      stateRefs:
        $ref: "#/$defs/idList"
      disclosureClaimRefs:
        $ref: "#/$defs/idList"
