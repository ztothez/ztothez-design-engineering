$schema: https://json-schema.org/draft/2020-12/schema
$id: https://local.ztothez-design-engineering/schemas/comparison-methodology-1.0.schema.json
title: ZtotheZ Interface Comparison Methodology
description: Version 1.0 contract for anonymous, task-based, evidence-separated interface comparisons.
type: object
additionalProperties: false
required: [version, id, title, preparedAt, preparedBy, candidates, viewports, states, stages, tasks, rubric, evidencePolicy, decision]
properties:
  version:
    const: "1.0"
  id:
    $ref: "#/$defs/id"
  title:
    $ref: "#/$defs/shortText"
  preparedAt:
    type: string
    format: date-time
  preparedBy:
    $ref: "#/$defs/preparedBy"
  candidates:
    type: array
    minItems: 2
    maxItems: 12
    items:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/$defs/id"
        label:
          $ref: "#/$defs/shortText"
  viewports:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
      additionalProperties: false
      required: [id, width, height]
      properties:
        id:
          $ref: "#/$defs/id"
        width:
          type: integer
          minimum: 240
          maximum: 3840
        height:
          type: integer
          minimum: 240
          maximum: 5000
  states:
    $ref: "#/$defs/requiredItems"
  stages:
    type: array
    minItems: 1
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [id, label, required, scope, evidenceKinds]
      properties:
        id:
          $ref: "#/$defs/id"
        label:
          $ref: "#/$defs/shortText"
        required:
          type: boolean
        scope:
          enum: [candidate, comparison]
        evidenceKinds:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items:
            $ref: "#/$defs/artifactKind"
  tasks:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required: [id, prompt, successCriteria, measurements]
      properties:
        id:
          $ref: "#/$defs/id"
        prompt:
          $ref: "#/$defs/text"
        successCriteria:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/$defs/text"
        measurements:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [task-completion, time-on-task, navigation-errors, comprehension-accuracy, recovery-attempts, confidence, perceived-visual-quality]
  rubric:
    type: object
    additionalProperties: false
    required: [scale, categories]
    properties:
      scale:
        type: object
        additionalProperties: false
        required: [minimum, maximum, anchors]
        properties:
          minimum:
            const: 0
          maximum:
            const: 4
          anchors:
            type: object
            additionalProperties: false
            required: ["0", "1", "2", "3", "4"]
            properties:
              "0": { $ref: "#/$defs/shortText" }
              "1": { $ref: "#/$defs/shortText" }
              "2": { $ref: "#/$defs/shortText" }
              "3": { $ref: "#/$defs/shortText" }
              "4": { $ref: "#/$defs/shortText" }
      categories:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required: [id, label, weight, criteria]
          properties:
            id:
              $ref: "#/$defs/id"
            label:
              $ref: "#/$defs/shortText"
            weight:
              type: integer
              minimum: 1
              maximum: 100
            criteria:
              type: array
              minItems: 1
              maxItems: 30
              items:
                type: object
                additionalProperties: false
                required: [id, prompt, measurement, evidenceLevel, scoreMinimum, scoreMaximum]
                properties:
                  id:
                    $ref: "#/$defs/id"
                  prompt:
                    $ref: "#/$defs/text"
                  measurement:
                    enum: [rating, comprehension, task-observation]
                  evidenceLevel:
                    enum: [human-expert, representative-user]
                  scoreMinimum:
                    const: 0
                  scoreMaximum:
                    const: 4
  evidencePolicy:
    type: object
    additionalProperties: false
    required: [anonymizeCandidates, counterbalanceOrder, retainArtifacts, separateEvidenceLevels, requireHumanAttribution, prohibitAgentHumanAttestation]
    properties:
      anonymizeCandidates: { const: true }
      counterbalanceOrder: { const: true }
      retainArtifacts: { const: true }
      separateEvidenceLevels: { const: true }
      requireHumanAttribution: { const: true }
      prohibitAgentHumanAttestation: { const: true }
  decision:
    type: object
    additionalProperties: false
    required: [minimumCategoryScore, requireAllStagesPass, prohibitContradictedClaims, requiredEvidenceLevels]
    properties:
      minimumCategoryScore:
        type: number
        minimum: 0
        maximum: 4
      requireAllStagesPass:
        type: boolean
      prohibitContradictedClaims:
        type: boolean
      requiredEvidenceLevels:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: "#/$defs/evidenceLevel"
$defs:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
  shortText:
    type: string
    minLength: 1
    maxLength: 256
  text:
    type: string
    minLength: 1
    maxLength: 1024
  preparedBy:
    type: object
    additionalProperties: false
    required: [type, name]
    properties:
      type:
        enum: [agent, human, mixed]
      name:
        $ref: "#/$defs/shortText"
  evidenceLevel:
    enum: [automated, ai-assisted-expert, human-expert, representative-user]
  artifactKind:
    enum: [build-report, typecheck-report, test-report, static-audit, runtime-report, journey-report, screenshot, export, source-inspection, human-review, user-session]
  requiredItems:
    type: array
    minItems: 1
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [id, label, required]
      properties:
        id:
          $ref: "#/$defs/id"
        label:
          $ref: "#/$defs/shortText"
        required:
          type: boolean
