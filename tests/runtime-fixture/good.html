<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runtime fixture</title>
    <style>
      :root { color-scheme: dark; --bg: #071018; --fg: #f8fafc; --accent: #2dd4bf; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui; }
      main { width: min(100% - 32px, 760px); margin: 48px auto; }
      button, a, input { min-height: 44px; }
      a { display: inline-flex; min-width: 44px; align-items: center; color: var(--accent); }
      input { width: 100%; max-width: 100%; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      pre { width: 100%; max-width: 100%; overflow: auto; }
      h1 { font-size: 1.75rem; overflow-wrap: anywhere; }
      canvas { display: block; width: min(100%, 320px); height: 120px; margin-top: 24px; border: 1px solid var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/good">Home</a>
      <h1>Runtime verification fixture</h1>
      <label for="name">Project name</label>
      <input id="name" name="name" />
      <button id="status" type="button" data-mode="demo">Check status</button>
      <button id="open" type="button">Generate report</button>
      <a id="download" download="report.json" href="/download/report.json">Download report</a>
      <p id="result" hidden>Report generated successfully.</p>
      <pre id="json">{"scores":{"coverage":100}}</pre>
      <canvas id="preview" width="320" height="120" aria-label="Generated preview"></canvas>
    </main>
    <script>
      document.querySelector('#open').addEventListener('click', () => {
        document.querySelector('#result').hidden = false;
      });
      document.querySelector('#status').addEventListener('click', () => fetch('/api/status'));
      const context = document.querySelector('#preview').getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 320, 120);
      gradient.addColorStop(0, '#2dd4bf');
      gradient.addColorStop(1, '#2563eb');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 320, 120);
    </script>
  </body>
</html>
