<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced accessibility failures</title>
    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #ffffff; color: #111111; font: 16px/1.5 system-ui; }
      #focus-cover { position: fixed; inset: 0 0 auto; z-index: 100; height: 72px; padding: 16px; background: #111827; color: #ffffff; }
      main { width: min(100% - 32px, 720px); margin: 0 auto; padding-top: 12px; }
      button:focus-visible { outline: 3px solid #dc2626; outline-offset: 2px; }
      #covered-focus, #trap, #positive-order, #later-control { min-width: 120px; min-height: 44px; }
      #covered-focus { display: block; }
      h1 { margin-top: 96px; }
      #low-contrast { color: #a0a0a0; }
      #tiny-target { width: 16px; height: 16px; min-width: 0; min-height: 0; padding: 0; border: 0; }
      #reflow-panel { width: 420px; padding: 16px; border: 1px solid #111111; }
      #text-clip { width: 180px; height: 30px; overflow: hidden; white-space: nowrap; }
      #moving-box { width: 48px; height: 48px; background: #2563eb; animation: slide 2s linear infinite; }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(160px); } }
    </style>
  </head>
  <body>
    <div id="focus-cover">Fixed application header</div>
    <main>
      <button id="covered-focus" type="button">Covered action</button>
      <h1>Advanced verifier fixture</h1>
      <p id="low-contrast">This low contrast status must be detected.</p>
      <button id="tiny-target" type="button" aria-label="Tiny action"></button>
      <button id="trap" type="button">Keyboard trap</button>
      <button id="positive-order" type="button" tabindex="2">Forced order</button>
      <button id="later-control" type="button">Later control</button>
      <section id="reflow-panel">
        <h2>Fixed reflow panel</h2>
        <p>This panel fits normally but exceeds the layout viewport when zoomed.</p>
      </section>
      <p id="text-clip">Settings available now</p>
      <div id="moving-box" aria-label="Moving processing indicator"></div>
    </main>
    <script>
      document.querySelector('#trap').addEventListener('keydown', (event) => {
        if (event.key === 'Tab') {
          event.preventDefault();
          event.currentTarget.focus();
        }
      });
    </script>
  </body>
</html>
