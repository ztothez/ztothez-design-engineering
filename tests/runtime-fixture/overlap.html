<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout collision fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 2400px; font: 16px/1.5 system-ui; }
      aside { position: sticky; top: 0; z-index: 10; width: 100%; height: 320px; padding: 24px; background: #111827; color: white; }
      .collision { position: relative; height: 80px; margin-top: 24px; }
      .collision button { position: absolute; width: 150px; height: 48px; }
      #first-control { left: 0; top: 0; }
      #second-control { left: 40px; top: 16px; }
      main { min-height: 1800px; padding: 32px 24px; }
      #critical-action { min-height: 48px; }
    </style>
  </head>
  <body>
    <aside id="blocking-sidebar">
      <strong>Oversized mobile navigation</strong>
      <div class="collision">
        <button id="first-control" type="button">First action</button>
        <button id="second-control" type="button">Second action</button>
      </div>
    </aside>
    <main>
      <h1 id="task-heading">Critical task content</h1>
      <p>The task surface must not disappear behind mobile navigation while scrolling.</p>
      <button id="critical-action" type="button">Complete critical task</button>
    </main>
  </body>
</html>
