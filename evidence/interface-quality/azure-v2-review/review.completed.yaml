          left, findings right) that preserves visual weight and alignment. Typography, spacing, and color 
          remain coherent throughout.
      - candidate: anonymous-d
        criterion: responsive-composition
        score: 4
        rationale: |-
          Candidate-d-overview-mobile.png adapts elegantly: the four top metrics stack into a single column 
          with full-width cards (100% - 24px padding), labels remain readable, and metric values maintain 
          font weight and size. The pie chart and Infrastructure Health chart stack vertically without 
          clipping, axis labels remain legible (May 4, May 5, ..., May 10 on x-axis; 0, 25, 50, 75, 100 on 
          y-axis). The recommendations list preserves priority badges and savings amounts with right-aligned 
          pricing. Tablet view introduces a 2-column layout for cards, maintaining readability. Desktop and 
          wide views expand to multi-column grids without awkward empty space or wrapping issues. All interactive 
          elements (buttons, links) maintain 44px+ tap targets. No significant loss of information or priority 
          hierarchy across all viewport sizes.
      - candidate: anonymous-e
        criterion: disclosure-consistency
        score: 4
        rationale: |-
          Candidate-e-overview-wide.png displays "PRODUCTION-SHAPED BENCHMARK ESTATE" as a context label, 
          immediately clarifying this is a benchmark comparison, not a live deployment. The top row shows 
          four explicit metadata fields: "Data mode: demo", "Connection: local fixture only", "Processing 
          origin: imported", and "Snapshot: May 10, 2024 10:30 EEST". These four fields directly address 
          data origin, connection type, processing mode, and freshness. The "Decision Boundary" section at 
          the right explicitly states Environment (Production-shaped benchmark estate), Source (imported 
          fixed comparison fixture), Score (142 resources across compute, storage, network), and Limitation 
          (No Azure tenant is connected). Analysis-wide.png preserves all four metadata fields and adds a 
          "CONTROLLED BENCHMARK WORKFLOW" section that explains: "The API evaluates the fixed imported 
